<!-- External Config Load -->
  <script src="config.js"></script>

  <!-- Application JS Logic with Direct Camera Vision Engine -->
  <script>
    let state = {
      role: 'senior',
      activeBagCode: 'SUD-00101',
      activeUser: null,
      scriptUrl: localStorage.getItem('sudflow_script_url') || (typeof CONFIG !== 'undefined' ? CONFIG.SCRIPT_URL : ''),
      html5QrCodeEngine: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const bagParam = urlParams.get('bag');
      if (bagParam) {
        state.activeBagCode = bagParam;
        selectRole('senior');
        handleCodeScanned(bagParam);
      }
      if (state.scriptUrl) {
        document.getElementById('scriptUrlInput').value = state.scriptUrl;
        document.getElementById('apiNotice').classList.add('hidden');
      } else {
        document.getElementById('apiNotice').classList.remove('hidden');
      }
    });

    function logActivity(msg) {
      const log = document.getElementById('activityLog');
      const entry = document.createElement('p');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.prepend(entry);
    }

    function showLandingPage() {
      stopCameraScanner();
      document.getElementById('landingPage').classList.remove('hidden');
      document.getElementById('driverRegisterPage').classList.add('hidden');
      document.getElementById('hubRegisterPage').classList.add('hidden');
      document.getElementById('workspacePage').classList.add('hidden');
    }

    function selectRole(role) {
      state.role = role;
      document.getElementById('activeRoleBadge').textContent = `Role: ${role.toUpperCase()}`;
      
      if (role === 'senior') {
        document.getElementById('landingPage').classList.add('hidden');
        document.getElementById('workspacePage').classList.remove('hidden');
        document.getElementById('seniorView').classList.remove('hidden');
        document.getElementById('driverView').classList.add('hidden');
        document.getElementById('hubView').classList.add('hidden');
        handleCodeScanned(state.activeBagCode);
      } else if (role === 'driver') {
        document.getElementById('landingPage').classList.add('hidden');
        document.getElementById('driverRegisterPage').classList.remove('hidden');
      } else if (role === 'hub') {
        document.getElementById('landingPage').classList.add('hidden');
        document.getElementById('hubRegisterPage').classList.remove('hidden');
      }
    }

    // DIRECT HARDWARE CAMERA SCANNER ENGINE
    async function showScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      
      if (!state.html5QrCodeEngine) {
        state.html5QrCodeEngine = new Html5Qrcode("reader");
      }

      const cameraConfig = { 
        fps: 15, 
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      try {
        logActivity("Requesting browser camera permission...");
        // Attempts rear camera on mobile (environment) or primary camera on desktop
        await state.html5QrCodeEngine.start(
          { facingMode: "environment" },
          cameraConfig,
          (decodedText) => {
            logActivity(`Camera successfully decoded tag: ${decodedText}`);
            let bagCode = decodedText;
            if (decodedText.includes('bag=')) {
              try {
                const url = new URL(decodedText);
                bagCode = url.searchParams.get('bag') || decodedText;
              } catch(e){}
            }
            closeScannerModal();
            selectRole('senior');
            handleCodeScanned(bagCode);
          },
          (errorMessage) => {
            // Continuous frame parse failures are normal while aligning camera
          }
        );
        logActivity("Camera hardware stream online.");
      } catch (err) {
        logActivity(`Camera hardware error: ${err}`);
        alert("Camera Access Error: Make sure your site is running over HTTPS (GitHub Pages) and camera permissions are allowed in your browser settings.");
      }
    }

    async function closeScannerModal() {
      await stopCameraScanner();
      document.getElementById('scannerModal').classList.add('hidden');
    }

    async function stopCameraScanner() {
      if (state.html5QrCodeEngine && state.html5QrCodeEngine.isScanning) {
        try {
          await state.html5QrCodeEngine.stop();
          logActivity("Camera stream deactivated.");
        } catch (e) {
          console.error("Error stopping camera", e);
        }
      }
    }

    function handleManualScan() {
      const val = document.getElementById('manualBagInput').value;
      closeScannerModal();
      selectRole('senior');
      handleCodeScanned(val);
    }

    function handleCodeScanned(bagCode) {
      state.activeBagCode = bagCode;
      document.getElementById('seniorBagCode').textContent = bagCode;
      document.getElementById('driverBagCode').textContent = bagCode;
      document.getElementById('hubBagCode').textContent = bagCode;

      if (state.scriptUrl) {
        fetch(`${state.scriptUrl}?bag=${encodeURIComponent(bagCode)}`)
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') populateUserData(data.user);
          });
      } else {
        populateUserData({
          full_name: "Eleanor Vance",
          address: "742 Evergreen Terr, Apt 3B",
          facility: "Oakridge Senior Living",
          preferences: "Hypoallergenic Detergent, Low Heat"
        });
      }
    }

    function populateUserData(user) {
      document.getElementById('seniorName').textContent = user.full_name || 'Senior Customer';
      document.getElementById('seniorAddress').textContent = `${user.address} • ${user.facility || 'Direct Household'}`;
      document.getElementById('seniorPrefs').textContent = `✨ Prefs: ${user.preferences || 'Standard Wash'}`;
      document.getElementById('driverAddressText').textContent = `${user.full_name} - ${user.address}. Senior Note: Soft knock required.`;
      logActivity(`Loaded Square CRM profile for ${user.full_name}`);
    }

    function requestPickup() {
      logActivity(`Triggering Square On-Demand Pickup for ${state.activeBagCode}...`);
      alert(`Square Payment Link & DoorDash Delivery Dispatched for Bag ${state.activeBagCode}!`);
    }

    function calculateOverage() {
      const weight = parseFloat(document.getElementById('scaleWeight').value) || 0;
      const feeText = document.getElementById('overageFeeText');
      if (weight > 40) {
        const excess = weight - 40;
        feeText.textContent = `+$${(excess * 1.50).toFixed(2)} Overage`;
        feeText.className = "font-bold text-amber-800";
      } else {
        feeText.textContent = "Standard ($0.00)";
        feeText.className = "font-bold text-emerald-700";
      }
    }

    function updateBagStatus(status) {
      logActivity(`Status updated to: ${status}`);
      alert(`Bag status updated to ${status}`);
    }

    function submitDriverRegistration(e) {
      e.preventDefault();
      alert("Driver Registered in Square CRM & Google Sheet!");
      showLandingPage();
    }

    function submitHubRegistration(e) {
      e.preventDefault();
      alert("Laundromat Facility Registered!");
      showLandingPage();
    }

    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function saveSettings() {
      const url = document.getElementById('scriptUrlInput').value.trim();
      state.scriptUrl = url;
      localStorage.setItem('sudflow_script_url', url);
      document.getElementById('apiNotice').classList.toggle('hidden', !!url);
      toggleSettingsModal();
    }
  </script>
